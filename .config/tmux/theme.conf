# Catppuccin options. The plugin only fills in unset options, so this loads before tpm.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@thm_bg}]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_text_color},bg=#{@thm_bg}]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@thm_bg}]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_text_color},bg=#{@thm_bg}]"
set -g @catppuccin_window_flags "icon"
# New-output flag hidden for Claude Code windows: its TUI redraws constantly
set -g @catppuccin_window_flags_icon_format "##{?##{&&:##{window_activity_flag},##{&&:##{monitor-activity},##{!=:##{pane_current_command},claude}}},#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},} "
set -g @catppuccin_window_text " #{E:@window_label}"
set -g @catppuccin_window_current_text " #{E:@window_label}"
# @catppuccin_session_text stays catppuccin's default (" #S"); the (current/total) index is
# appended directly in modules/bar.conf's status-right instead of nested in here. A #() job
# that itself calls back into tmux (tmux_sessions.sh runs `tmux list-sessions`) reliably comes
# back empty when it's nested this many #{E:} layers deep inside the catppuccin module system
# -- jobs that just run an external command (like git-branch-segment) don't have that problem,
# only ones that recurse into tmux while the server is mid-way through evaluating this same
# nested format. Keeping it as a plain top-level job in status-right avoids the issue entirely.
