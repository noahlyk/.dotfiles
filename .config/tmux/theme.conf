# Catppuccin options. The plugin only fills in unset options, so this loads before tpm.
set -g @catppuccin_flavor "mocha"
# "none" is catppuccin's literal keyword for real tmux transparency (bg=default) --
# the string "default" means something else to it: fill with @thm_mantle.
set -g @catppuccin_status_background "none"
# "rounded" is catppuccin's built-in style (real  /  powerline-round glyphs,
# reverse-video against @_ctp_status_bg) -- our old "custom" style set colors with
# no actual separator glyph between them, which is what was rendering "square".
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
# New-output flag hidden for Claude Code windows: its TUI redraws constantly.
# window_active/window_last (the toggle-switch open/close icons) are dropped entirely --
# every tab was showing one or the other, which read as clutter, not information.
set -g @catppuccin_window_flags_icon_format "##{?##{&&:##{window_activity_flag},##{&&:##{monitor-activity},##{!=:##{pane_current_command},claude}}},#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},} "
set -g @catppuccin_window_text " #{E:@window_label}"
set -g @catppuccin_window_current_text " #{E:@window_label}"
# @catppuccin_session_text stays catppuccin's default (" #S"); the (current/total) index is
# appended directly in modules/bar.conf's status-right instead of nested in here. A #() job
# that itself calls back into tmux (tmux_sessions.sh runs `tmux list-sessions`) reliably comes
# back empty when it's nested this many #{E:} layers deep inside the catppuccin module system
# -- jobs that just run an external command (like git-branch-segment) don't have that problem,
# only ones that recurse into tmux while the server is mid-way through evaluating this same
# nested format. Keeping it as a plain top-level job in status-right avoids the issue entirely.
