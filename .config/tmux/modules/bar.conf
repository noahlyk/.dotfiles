# The status bar. Sourced after tpm so catppuccin's @thm_* colours and module helper exist,
# and after dank-colors.conf so those tokens already point at the live DMS palette.
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 150

# ── Bar and popups: transparent -- shows the terminal background through, no opaque fill ──
set -gF status-style "bg=default,fg=#{@thm_fg}"
set -g window-status-style default
set -g window-status-current-style default
set -g popup-style default
set -gF popup-border-style "fg=#{@thm_surface_1}"

# ── Tab contents: program icon, folder, pane count, Claude Code state ──
# @claude_state is set per pane by ~/.claude/hooks/tmux-claude-state.sh; the tab counts panes per state
set -g @claude_working_count "#{n:#{P:#{?#{==:#{@claude_state},working},x,}}}"
set -g @claude_waiting_count "#{n:#{P:#{?#{==:#{@claude_state},waiting},x,}}}"
set -g @claude_done_count "#{n:#{P:#{?#{==:#{@claude_state},done},x,}}}"
set -g @claude_marker "\
#{?#{!=:#{E:@claude_working_count},0}, #[fg=#{@thm_yellow}]󰔟#{?#{>:#{E:@claude_working_count},1}, #{E:@claude_working_count},}#[fg=#{@thm_fg}],}\
#{?#{!=:#{E:@claude_waiting_count},0}, #[fg=#{@thm_red}]#{?#{>:#{E:@claude_waiting_count},1}, #{E:@claude_waiting_count},}#[fg=#{@thm_fg}],}\
#{?#{!=:#{E:@claude_done_count},0}, #[fg=#{@thm_green}]#{?#{>:#{E:@claude_done_count},1}, #{E:@claude_done_count},}#[fg=#{@thm_fg}],}"
set -g @window_label "\
#(~/.config/tmux/scripts/window-icon '#{pane_current_command}') #W\
#{?#{>:#{window_panes},1},#{?window_zoomed_flag, #[fg=#{@thm_peach}]󰁌 #{window_panes}#[fg=default], 󰕰 #{window_panes}},}\
#{E:@claude_marker}"
set-hook -g 'session-window-changed[10]' "run-shell -b '~/.config/tmux/scripts/claude-clear-done #{window_id}'"
set-hook -g 'client-session-changed[10]' "run-shell -b '~/.config/tmux/scripts/claude-clear-done #{window_id}'"

# ── Your (current/total) session index: recomputed into a plain option by a script that
# itself calls tmux (see scripts/tmux_sessions.sh), never inline as a #() status-line job
# (that reliably deadlocks -- see the comment on @session_index_text's only reader below) ──
set-hook -g 'session-created[10]' "run-shell -b '~/.config/tmux/scripts/tmux_sessions.sh update-index'"
set-hook -g 'session-closed[10]' "run-shell -b '~/.config/tmux/scripts/tmux_sessions.sh update-index'"
set-hook -g 'client-session-changed[30]' "run-shell -b '~/.config/tmux/scripts/tmux_sessions.sh update-index'"
run-shell -b '~/.config/tmux/scripts/tmux_sessions.sh update-index'

# ── Background window alerts: catppuccin shows the bell/activity icons on tabs ──
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g activity-action other
set -g bell-action other
set -g window-status-activity-style default
set -g window-status-bell-style default

# ── Custom modules (one file each: %hidden vars are file-scoped at parse time) ──
source-file ~/.config/tmux/modules/git.conf

# ── Left: mode badges (copy, sync) ──
set -g status-left "\
#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow}]#[fg=#{@thm_crust}#,bg=#{@thm_yellow}#,bold]COPY#[fg=#{@thm_yellow}#,bg=default#,nobold] ,}\
#{?pane_synchronized,#[fg=#{@thm_red}]#[fg=#{@thm_crust}#,bg=#{@thm_red}#,bold]SYNC#[fg=#{@thm_red}#,bg=default#,nobold] ,}"

# ── Right: git branch, session name + your (current/total) index ──
# @session_index_text is a plain per-session option, kept current by the hooks above --
# NOT a #() job here. A status-line job that calls back into tmux (tmux_sessions.sh does,
# to list sessions) deadlocks against the very redraw that's waiting on its output, and
# reliably comes back empty forever; a job that only runs an external command (like
# git-branch-segment below) doesn't have that problem.
set -g status-right "\
#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)\
#{?#{!=:#(~/.config/tmux/scripts/git-branch-segment '#{pane_current_path}'),},#{E:@catppuccin_status_git},}\
#{E:@catppuccin_status_session}\
#{?@session_index_text,#[fg=#{@thm_overlay_1}] (#{@session_index_text}),}"
