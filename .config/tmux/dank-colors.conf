# Recolour catppuccin's @thm_* tokens to follow the live DankMaterialShell theme instead of
# a static catppuccin-mocha palette. Everything in modules/bar.conf and theme.conf is already
# written in terms of #{@thm_*} tokens (never literal hex), so overriding them here is enough.
# Must load after tpm (catppuccin sets its defaults when it loads) and before modules/bar.conf.
run-shell '~/.config/tmux/scripts/dank-tmux-colors'
