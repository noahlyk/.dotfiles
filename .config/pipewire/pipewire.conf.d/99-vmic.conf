# vinput -- "anything connected to vmic" (e.g. the synth) lands here. A
# genuine single-node repeater: a null-audio-sink adapter, not a
# filter-chain (which always splits capture/playback into two separate
# node objects). One node, one set of playback_FL/FR write ports, and
# PipeWire's automatic monitor_FL/FR mirror on that SAME node -- pw-links
# fans that mirror out into BOTH vmic_good's and vmic_fast's inputs. Fine
# for vinput specifically because nothing needs to *select* it as a mic --
# only pw-links ever reads it.
context.objects = [
  { factory = adapter
    args = {
      factory.name      = support.null-audio-sink
      node.name         = "vinput"
      node.description  = "vinput"
      media.class       = "Audio/Sink"
      audio.position     = "FL,FR"
    }
  }
]

# vmic_good/vmic_fast, below, DO need to be genuine Audio/Source devices
# (not just a sink's monitor) to be reliably selectable as a microphone by
# apps like Discord/OBS -- a Pulse-style null-sink's monitor isn't always
# exposed as an input device by app device pickers. So these stay
# filter-chain (its usual sink+source node pair), each a simple 2-channel
# passthrough; the actual "virtual + voice" mixing happens in pw-links'
# wiring (multiple links landing on the same destination port are summed
# natively by PipeWire), not in any internal graph here.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.name        = "vmic_good"
      node.description = "vmic_good"
      media.class      = "Virtual"

      capture.props = {
        media.class    = "Audio/Sink"
        audio.channels = 2
        audio.position = [ FL FR ]
      }

      playback.props = {
        media.class = "Audio/Source"
      }

      filter.graph = {
        inputs  = [ "in1:In" "in2:In" ]
        outputs = [ "outL:Out" "outR:Out" ]

        nodes = [
          { name = in1  type = builtin label = copy }
          { name = in2  type = builtin label = copy }

          { name = outL type = builtin label = copy }
          { name = outR type = builtin label = copy }
        ]

        links = [
          { output = "in1:Out" input = "outL:In" }
          { output = "in2:Out" input = "outR:In" }
        ]
      }
    }
  }
  { name = libpipewire-module-filter-chain
    args = {
      node.name        = "vmic_fast"
      node.description = "vmic_fast"
      media.class      = "Virtual"

      capture.props = {
        media.class    = "Audio/Sink"
        audio.channels = 2
        audio.position = [ FL FR ]
      }

      playback.props = {
        media.class = "Audio/Source"
      }

      filter.graph = {
        inputs  = [ "in1:In" "in2:In" ]
        outputs = [ "outL:Out" "outR:Out" ]

        nodes = [
          { name = in1  type = builtin label = copy }
          { name = in2  type = builtin label = copy }

          { name = outL type = builtin label = copy }
          { name = outR type = builtin label = copy }
        ]

        links = [
          { output = "in1:Out" input = "outL:In" }
          { output = "in2:Out" input = "outR:In" }
        ]
      }
    }
  }
]
