# Two virtual mic devices, in a "lane" arrangement wired up by pw-links:
#
#   - "vmic"     -- the RNNoise/quality voice (micproc's out_rnn_* lane) PLUS
#                    anything else routed in (e.g. the synth) all land on
#                    THIS node's playback_FL/FR. This is the device apps
#                    (Discord/OBS/...) select as their microphone.
#   - "vmonitor" -- the fast/no-RNNoise voice (micproc's out_fast_* lane)
#                    PLUS the same "anything else" land on ITS playback_FL/FR.
#                    pw-links routes vmonitor's output to your own speakers/
#                    headphones only -- never captured by other apps. This is
#                    what YOU hear: the chain's normal sub-1ms latency,
#                    instead of RNNoise's fixed ~10ms.
#
# Both nodes are otherwise identical: a plain 2-channel filter-chain (a
# sink+source pair; the source side is what a device records from -- a Pulse
# null-sink would collapse this to one node, but its source is only a
# monitor, which apps don't reliably expose as an input device). Multiple
# sources landing on the SAME playback_FL/FR ports (e.g. voice + synth) are
# summed natively by PipeWire at the graph level -- no internal mixing node
# needed, same as how the synth already mixed into the single "vmic" before
# this became two lanes.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.name        = "vmic"
      node.description = "vmic"
      media.class      = "Virtual"

      capture.props = {
          media.class = "Audio/Sink"
          audio.channels = 2
          audio.position = [ FL FR ]
      }

      playback.props = {
        media.class = "Audio/Source"
      }

      filter.graph = {
        inputs  = [ "in1:In" "in2:In" ]
        outputs = [ "outL:Out" "outR:Out" ]

        nodes = [
          { name = in1  type = builtin label = copy }
          { name = in2  type = builtin label = copy }

          { name = outL type = builtin label = copy }
          { name = outR type = builtin label = copy }
        ]

        links = [
          { output = "in1:Out" input = "outL:In" }
          { output = "in2:Out" input = "outR:In" }
        ]
      }
    }
  }
  { name = libpipewire-module-filter-chain
    args = {
      node.name        = "vmonitor"
      node.description = "vmonitor"
      media.class      = "Virtual"

      capture.props = {
          media.class = "Audio/Sink"
          audio.channels = 2
          audio.position = [ FL FR ]
      }

      playback.props = {
        media.class = "Audio/Source"
      }

      filter.graph = {
        inputs  = [ "in1:In" "in2:In" ]
        outputs = [ "outL:Out" "outR:Out" ]

        nodes = [
          { name = in1  type = builtin label = copy }
          { name = in2  type = builtin label = copy }

          { name = outL type = builtin label = copy }
          { name = outR type = builtin label = copy }
        ]

        links = [
          { output = "in1:Out" input = "outL:In" }
          { output = "in2:Out" input = "outR:In" }
        ]
      }
    }
  }
]
