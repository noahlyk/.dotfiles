# Font Configuration
font_size 12.0

# Window Configuration
dynamic_background_opacity yes
background_blur 32
hide_window_decorations yes
clipboard_control write-clipboard read-clipboard

# Cursor Configuration
cursor_shape block

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
# No tabs: ctrl+t goes to the app (fzf etc.); unbind kitty's default tab keys
map ctrl+t no_op
map ctrl+shift+t no_op
map ctrl+shift+q no_op
map ctrl+shift+right no_op
map ctrl+shift+left no_op
map ctrl+shift+. no_op
map ctrl+shift+, no_op
map ctrl+shift+alt+t no_op
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf

include userprefs.conf

# Claude logo glyph (U+F6000), used by the tmux tabs/status
symbol_map U+F6000 Claude Glyph
